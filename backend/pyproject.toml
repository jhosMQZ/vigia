[project]
name = "vigia"
version = "0.1.0"
description = "Vigía — plataforma de pretesting y auditoría de seguridad (SAST + DAST + API + infraestructura + correlación)"
requires-python = ">=3.11"
license = { text = "LicenseRef-Vigia-Uso-No-Comercial" }  # ver LICENSE: código fuente disponible, uso no comercial
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "dnspython>=2.6",
  "cryptography>=42",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "defusedxml>=0.7",
  "reportlab>=4.2",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "bandit>=1.7", "paramiko>=3.4"]  # paramiko: SSH server of the tunnel tests
postgres = ["psycopg[binary]>=3.2"]
browser = ["playwright>=1.45"]

[project.scripts]
vigia = "vigia.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vigia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
vigia = ["tools/manifest.json", "tools/locks/*", "tools/rules/**/*", "data/wordlists/*"]
